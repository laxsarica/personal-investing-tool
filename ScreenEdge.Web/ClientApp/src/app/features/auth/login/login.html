<div class="login-page">
  <div class="login-card">
    <h1 class="text-heading">ScreenEdge</h1>
    <p class="text-secondary">Indian Stock Screener</p>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label class="text-label" for="username">Username</label>
        <input id="username" type="text" [(ngModel)]="username" name="username"
               placeholder="Enter username" autocomplete="username" required>
      </div>

      <div class="form-group">
        <label class="text-label" for="password">Password</label>
        <input id="password" type="password" [(ngModel)]="password" name="password"
               placeholder="Enter password" autocomplete="current-password" required>
      </div>

      @if (error) {
        <div class="error-message">{{ error }}</div>
      }

      <button type="submit" class="btn btn-primary login-btn" [disabled]="loading || !username || !password">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
